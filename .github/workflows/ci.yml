---
name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck
      - name: Lint
        run: pnpm -r lint
      - name: Unit + integration (workspace)
        run: pnpm -r test
      - name: Sync-engine coverage gate (≥90 line / ≥80 branch)
        run: pnpm --filter @brian/sync-engine test:coverage
      - name: Build (PWA + packages)
        run: pnpm -r build
