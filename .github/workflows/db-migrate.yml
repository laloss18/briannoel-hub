---
# Aplica UNA migración SQL al proyecto Supabase (manual).
# El MVP tiene UN proyecto (PRD env collapse). Se usa la Management API
# (`/v1/projects/{ref}/database/query`, autenticada con SUPABASE_ACCESS_TOKEN)
# en vez de `supabase db push` porque la historia del CLI no está sincronizada
# (0001-0007 se aplicaron a mano). Las migraciones deben ser idempotentes.
name: DB Migrate (manual)
on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Ruta de la migración a aplicar'
        required: true
        default: 'supabase/migrations/0009_admin_usuarios.sql'

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar migración (Management API)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          MIGRATION_FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail
          payload=$(jq -Rs '{query: .}' < "$MIGRATION_FILE")
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "HTTP ${code}"
          cat /tmp/resp.json
          test "${code}" = "200" -o "${code}" = "201"
          echo "Aplicada: $MIGRATION_FILE"
