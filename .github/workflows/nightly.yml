---
name: Nightly
on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC (00:00 hora Sao Paulo)
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit + integration (coverage report)
        run: pnpm --filter @brian/sync-engine test:coverage
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Build
        run: pnpm -r build
